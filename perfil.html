<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - ASISTE-UNILIBRE</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Font Awesome: librería de iconos profesionales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <span class="logo-icon"><i class="fas fa-book-open"></i></span>
                <span class="logo-text">ASISTE-UNILIBRE</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="perfil.html">Mi Perfil</a></li>
                <li><a href="notificaciones.html">Notificaciones</a></li>
                <li><a href="index.html">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <section class="content-section">
        <div class="content-container">
            <div class="page-header">
                <button onclick="history.back()" class="btn-back"><i class="fas fa-arrow-left"></i> Volver</button>
                <h2><i class="fas fa-user-circle"></i> Mi Perfil</h2>
            </div>
            
            <div class="perfil-container">
                <div class="perfil-sidebar">
                    <div class="perfil-avatar">
                        <div class="avatar-circle"><i class="fas fa-user"></i></div>
                        <button class="btn-small">Cambiar Foto</button>
                    </div>
                    <div class="perfil-info">
                        <h3>Usuario Ejemplo</h3>
                        <p>usuario@unilibre.edu.co</p>
                        <span class="badge badge-estudiante">Estudiante</span>
                    </div>
                </div>

                <div class="perfil-content">
                    <div class="perfil-section">
                        <h3>Información Personal</h3>
                        <form class="perfil-form">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Nombre Completo</label>
                                    <input type="text" class="form-control" value="Usuario Ejemplo">
                                </div>
                                <div class="form-group">
                                    <label>Documento</label>
                                    <input type="text" class="form-control" value="1234567890">
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Email Institucional</label>
                                    <input type="email" class="form-control" value="usuario@unilibre.edu.co">
                                </div>
                                <div class="form-group">
                                    <label>Teléfono</label>
                                    <input type="tel" class="form-control" value="3001234567">
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Dirección</label>
                                <input type="text" class="form-control" value="Calle 123 #45-67">
                            </div>

                            <button type="submit" class="btn-primary">Guardar Cambios</button>
                        </form>
                    </div>

                    <div class="perfil-section">
                        <h3>Cambiar Contraseña</h3>
                        <!-- Mensaje de éxito al guardar -->
                        <div id="msg-password" style="display:none;" class="form-error-msg" style="background:#d4edda; color:#155724; border-color:#c3e6cb;"></div>
                        <form class="perfil-form" onsubmit="return validarPassword()">
                            <div class="form-group">
                                <label>Contraseña Actual</label>
                                <input type="password" id="pass-actual" class="form-control">
                                <span class="field-error" id="error-pass-actual"></span>
                            </div>
                            <div class="form-group">
                                <label>Nueva Contraseña</label>
                                <input type="password" id="pass-nueva" class="form-control">
                                <span class="field-error" id="error-pass-nueva"></span>
                            </div>
                            <div class="form-group">
                                <label>Confirmar Nueva Contraseña</label>
                                <input type="password" id="pass-confirmar" class="form-control">
                                <span class="field-error" id="error-pass-confirmar"></span>
                            </div>
                            <button type="submit" class="btn-primary">Cambiar Contraseña</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        /**
         * Muestra un error en un campo del formulario de contraseña
         * @param {string} id - ID del campo
         * @param {string} msg - Mensaje de error
         */
        function errorPass(id, msg) {
            document.getElementById(id).classList.add('input-error');
            document.getElementById('error-' + id).textContent = msg;
        }

        /**
         * Limpia el error de un campo del formulario de contraseña
         * @param {string} id - ID del campo a limpiar
         */
        function limpiarPass(id) {
            document.getElementById(id).classList.remove('input-error');
            document.getElementById('error-' + id).textContent = '';
        }

        /**
         * Valida el formulario de cambio de contraseña:
         * - Verifica que la contraseña actual no esté vacía
         * - Verifica que la nueva contraseña tenga al menos 6 caracteres
         * - Verifica que la confirmación coincida con la nueva contraseña
         * @returns {boolean} false para prevenir el envío nativo
         */
        function validarPassword() {
            ['pass-actual', 'pass-nueva', 'pass-confirmar'].forEach(limpiarPass);
            document.getElementById('msg-password').style.display = 'none';

            const actual    = document.getElementById('pass-actual').value;
            const nueva     = document.getElementById('pass-nueva').value;
            const confirmar = document.getElementById('pass-confirmar').value;
            let valido      = true;

            if (!actual) {
                errorPass('pass-actual', 'Ingrese su contraseña actual.');
                valido = false;
            }

            if (!nueva) {
                errorPass('pass-nueva', 'Ingrese la nueva contraseña.');
                valido = false;
            } else if (nueva.length < 6) {
                errorPass('pass-nueva', 'La contraseña debe tener al menos 6 caracteres.');
                valido = false;
            }

            if (!confirmar) {
                errorPass('pass-confirmar', 'Confirme la nueva contraseña.');
                valido = false;
            } else if (nueva !== confirmar) {
                errorPass('pass-confirmar', 'Las contraseñas no coinciden.');
                valido = false;
            }

            // Mostrar mensaje de éxito si todo es válido
            if (valido) {
                const msg = document.getElementById('msg-password');
                msg.textContent    = '✓ Contraseña actualizada correctamente.';
                msg.style.display  = 'block';
                msg.style.background = '#d4edda';
                msg.style.color      = '#155724';
                msg.style.border     = '1px solid #c3e6cb';
                // Limpiar campos
                ['pass-actual', 'pass-nueva', 'pass-confirmar'].forEach(id => {
                    document.getElementById(id).value = '';
                });
            }

            return false;
        }

        // Limpiar errores en tiempo real
        ['pass-actual', 'pass-nueva', 'pass-confirmar'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => limpiarPass(id));
        });
    </script>

    <footer>
        <div class="footer-content">
            <p>&copy; 2024 ASISTE-UNILIBRE. Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>
